# Builds a signed release APK with Buildozer and attaches it to a GitHub Release.
#
# Triggered by pushing a tag matching v*.*.* (e.g. v1.0.0), or manually via
# workflow_dispatch. Requires these repository secrets, generated with
# `keytool -genkeypair`:
#   P4A_RELEASE_KEYSTORE_BASE64  - base64-encoded contents of the .keystore file
#   P4A_RELEASE_KEYSTORE_PASSWD  - keystore password
#   P4A_RELEASE_KEYALIAS         - key alias
#   P4A_RELEASE_KEYALIAS_PASSWD  - key password

name: Android release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-release:
    name: Build signed release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Buildozer global directory (SDK/NDK)
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-global-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-global-

      - name: Cache Rust toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo
            ~/.rustup
          key: rust-android-${{ runner.os }}

      - name: Install Rust toolchain for Android
        # The cryptography recipe's Rust component (cryptography-cffi) needs
        # rustup on the host to cross-compile for Android; the buildozer
        # image doesn't include it, so it's installed here and mounted into
        # the container below.
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          fi
          "$HOME/.cargo/bin/rustup" target add aarch64-linux-android

      - name: Decode release keystore
        run: |
          echo "${{ secrets.P4A_RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "$GITHUB_WORKSPACE/release.keystore"

      - name: Determine app version from tag
        id: version
        run: |
          # Keeps the Android app version in sync with the desktop release
          # tag (e.g. tag v3.0.0 -> APP_VERSION=3.0.0) instead of the static
          # `version` in buildozer.spec. Falls back to that static value for
          # manual workflow_dispatch runs not triggered by a tag.
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=" >> "$GITHUB_OUTPUT"
          fi

      - name: Put the Android entry point in place
        # python-for-android hardcodes the app entry point filename to
        # main.py — there's no buildozer.spec option to change it. main.py
        # in this repo is the desktop CLI, so the Kivy app (android_main.py)
        # is swapped into its place for this (ephemeral) checkout only. See
        # scripts/build-android.sh for the equivalent local-dev workflow,
        # which restores the real main.py afterward.
        run: cp android_main.py main.py

      - name: Pull official Buildozer image
        run: docker pull kivy/buildozer:latest

      - name: Build with Buildozer
        # Runs the official kivy/buildozer Docker image directly instead of a
        # third-party wrapper action, since this step has access to the
        # signing secrets below. See https://github.com/kivy/buildozer for
        # the documented docker run invocation this follows.
        run: |
          mkdir -p "$HOME/.buildozer"
          version_env=()
          if [ -n "${{ steps.version.outputs.value }}" ]; then
            version_env=(--env "APP_VERSION=${{ steps.version.outputs.value }}")
          fi
          docker run --rm \
            --volume "$HOME/.buildozer":/home/user/.buildozer \
            --volume "$GITHUB_WORKSPACE":/home/user/hostcwd \
            --volume "$HOME/.cargo":/home/user/.cargo \
            --volume "$HOME/.rustup":/home/user/.rustup \
            "${version_env[@]}" \
            --env PATH="/home/user/.cargo/bin:/home/user/.buildozer/android/platform/apache-ant-1.9.4/bin:/home/user/.venv/bin:/home/user/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" \
            --env P4A_RELEASE_KEYSTORE=/home/user/hostcwd/release.keystore \
            --env P4A_RELEASE_KEYSTORE_PASSWD="${{ secrets.P4A_RELEASE_KEYSTORE_PASSWD }}" \
            --env P4A_RELEASE_KEYALIAS="${{ secrets.P4A_RELEASE_KEYALIAS }}" \
            --env P4A_RELEASE_KEYALIAS_PASSWD="${{ secrets.P4A_RELEASE_KEYALIAS_PASSWD }}" \
            kivy/buildozer android release

      - name: Remove decoded keystore
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/release.keystore"

      # Manual (workflow_dispatch) runs have no tag to attach a release to —
      # e.g. for testing this pipeline on a feature branch without cutting a
      # real release on main. Upload the APK as a downloadable build artifact
      # instead in that case.
      - name: Upload APK as build artifact
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: dpyproxy-android-release
          path: bin/*.apk

      - name: Attach APK to GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: bin/*.apk
