# Target Python version
target-version = "py312"

# Only include these patterns for linting
include = ["*.py"]

# Set the maximum line length
line-length = 120

# Enable specific rule sets (E: pycodestyle, F: Pyflakes, I: Isort)
lint.select = ["E", "F", "I"]

# Never enforce these rules
lint.ignore = []

# android_main.py and services/service.py must mock out heavy/incompatible
# modules (aioquic, dns.quic, ...) before importing anything that
# transitively pulls them in — that puts real imports below non-import code
# by necessity.
[lint.per-file-ignores]
"android_main.py" = ["E402"]
"services/service.py" = ["E402"]
